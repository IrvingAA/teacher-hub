name: TeacherHub CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Download Secrets for Validation
        run: |
          doppler secrets download --project teacherhub-api --config dev --format env --no-file > .env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SERVICE }}

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build & Push to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.SERVICE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define Version Metadata
        id: version
        env:
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          # Execute version-env.sh and capture outputs
          eval $(bash scripts/version-env.sh)
          echo "SERVICE_TAG=${SERVICE_TAG}" >> "$GITHUB_OUTPUT"
          echo "OWNER_LC=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "GIT_SHA_SHORT=${GIT_SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.SERVICE_TAG }}
            APP_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.OWNER_LC }}/teacherhub-api:${{ steps.version.outputs.SERVICE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.OWNER_LC }}/teacherhub-api:latest
          cache-from: type=gha,scope=teacherhub-api
          cache-to: type=gha,scope=teacherhub-api,mode=max

      - name: Build & push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.OWNER_LC }}/teacherhub-api-nginx:${{ steps.version.outputs.SERVICE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.OWNER_LC }}/teacherhub-api-nginx:latest
          cache-from: type=gha,scope=teacherhub-nginx
          cache-to: type=gha,scope=teacherhub-nginx,mode=max

  deploy-trigger:
    name: Trigger Infrastructure Deployment
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Trigger astrohub-infra dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          repository: IrvingAA/astrohub-infra
          event-type: deploy-request
          client-payload: |-
            {
              "service": "teacherhub-api",
              "deployment": "develop",
              "environment": "develop",
              "image_tag": "${{ needs.build-and-push.outputs.image_tag }}",
              "source_repo": "${{ github.event.repository.name }}",
              "source_branch": "${{ github.ref_name }}",
              "source_sha": "${{ github.sha }}"
            }
