limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 2m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://code.iconify.design; connect-src 'self' https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

  location / {
    limit_req zone=api_rate burst=20 nodelay;

    proxy_pass http://app:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}
