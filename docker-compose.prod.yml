services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_VERSION: ${SERVICE_TAG:-latest}
        APP_GIT_SHA: ${GIT_SHA:-unknown}
    image: ${API_IMAGE}
    container_name: teacherhub_app_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-teacherhub_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - app_net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: prod
    image: ${NGINX_IMAGE}
    container_name: teacherhub_nginx_prod
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - edge_net
      - app_net

  postgres:
    image: postgres:16-alpine
    container_name: teacherhub_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-teacherhub_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-teacherhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: teacherhub_redis_prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
