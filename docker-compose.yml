services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: teacherhub_app_dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Forzamos que en Docker use los nombres de los servicios
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - '3001'
    networks:
      - app_net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: dev
    container_name: teacherhub_nginx_dev
    depends_on:
      - app
    ports:
      - '${NGINX_PUBLIC_PORT:-3005}:80'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run:mode=755,size=10m
      - /var/cache/nginx:mode=755,size=128m
    networks:
      - edge_net
      - app_net

  postgres:
    image: postgres:16-alpine
    container_name: teacherhub_postgres_dev
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-teacherhub_db}
    ports:
      - '${POSTGRES_PUBLIC_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-teacherhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge_net
      - app_net

  redis:
    image: redis:7-alpine
    container_name: teacherhub_redis_dev
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PUBLIC_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

volumes:
  postgres_data:
  redis_data:
  node_modules:

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
