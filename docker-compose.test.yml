services:
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: teacherhub_app_test
    environment:
      PORT: 3000
      NODE_ENV: test
      DB_SYNCHRONIZE: 'false'
      DB_RUN_MIGRATIONS: 'true'
      DB_HOST: postgres_test
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secret
      DB_NAME: teacherhub_test_db
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    command: ['sh', '-c', 'npm run db:migrate && npm test']
    networks:
      - test_net

  postgres_test:
    image: postgres:16-alpine
    container_name: teacherhub_postgres_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: teacherhub_test_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d teacherhub_test_db']
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - test_net

  redis_test:
    image: redis:7-alpine
    container_name: teacherhub_redis_test
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - test_net

networks:
  test_net:
    driver: bridge
